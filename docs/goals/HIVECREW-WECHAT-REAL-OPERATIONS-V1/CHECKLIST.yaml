p0_gates:
  - id: P0-GATE-01
    name: server_verified_task_run_receipt
    status: frozen
    statement: >
      A node is proven executed only by a server-side completed agent_task_queue row plus a
      completed execution_receipt. MaterializeCompletedTask reads GetExecutionReceipt(task.ID)
      and requires Terminal.Status == "completed" (server/internal/service/companyops_artifact_outcome.go,
      server/pkg/db/queries/companyops.sql). Client-supplied task_id/run_id/initial_task_id/current_task_id
      in a request or UI receipt are NOT server proof of execution.
    verifier: api_task_run_and_output_readback_server_side
    evidence_refs: [EV-WO00-CORRECTION]
  - id: P0-GATE-02
    name: companyops_authority_resolution
    status: frozen
    statement: >
      Real CompanyOps assignment requires an existing work_order_source_ref
      (hive://hivecosm/delivery/project/{project}/work-order/{work-order}), Employee, an active
      IdentityBinding (Employee->Agent edge), an exact Agent, a runtime Session
      (agent_task_queue.chat_session_id/session_id/runtime_id), and a HandoffNote. Authority chain
      ValidateAndFreezeExecutionTarget (server/internal/companyops/execution_target.go) resolves
      WorkOrder -> Employee -> active IdentityBinding -> exact Agent via
      HiveCosmAuthorityClient.ResolveOwnerWorkContext (server/internal/companyops/hivecosm_authority_client.go).
      workflow.AgentBinding (server/internal/workflow/types.go) is graph metadata only and is never
      resolved to a second employee registry here (graph_execution.go).
    verifier: companyops_authority_resolution
    evidence_refs: [EV-WO00-CORRECTION]
  - id: P0-GATE-03
    name: per_node_durable_lineage
    status: frozen
    statement: >
      One Task materializes at most one ArtifactCandidate (MaterializeCompletedTask, idempotency key
      completed-run:{task.ID}). WorkflowRepository (server/internal/workflow/repository.go) only persists
      Definition/Instance/Event, never node execution lineage. The four content nodes (research pack,
      draft, review report, publish package) each require their own Issue/Assignment/Task/Run/Candidate/Outcome
      lineage; a single Task-to-one-Candidate does NOT establish four node artifacts. Per-node durable
      execution lineage/readback must be frozen over the existing Task/Run + CompanyOps Artifact authority.
    verifier: per_node_lineage_contract
    evidence_refs: [EV-WO00-CORRECTION]
  - id: P0-GATE-04
    name: isolated_candidate_store_formal_authority_proof
    status: proven
    statement: >
      Candidate store vs formal HiveCosm Artifact/Outcome authority isolation is UNKNOWN in WO-00. The
      candidate DB artifact_replica_location ledger and artifact_candidate rows must be proven isolated
      from formal authority before any promotion claim. Marked READ_ONLY / contract-decision required;
      WO-00 authorizes no promotion and no formal authority write.
      WO-15 resolution: PROVEN_ISOLATED over current code paths and observed candidate config (single
      DATABASE_URL entry main.go:216, only two pools dbstats.go:83,222; candidate .env.worktree binds
      multica_hivecrew_operations_workflow_v2_512 and defines no HIVECOSM_* variable so promotion is
      fail-closed 503; the only formal-authority write is one POST to HIVECOSM_AUTHORITY_BASE_URL which
      is constructor-configurable to a loopback fake). Canary-time assertions 2/3/4/6/8 are deferred to
      WO-50; open risks (default-DSN fallback, no code guard on authority URL, shared-instance
      isolation, engine-3104 inference, CWD-sensitive object store) are recorded and must be handled in
      the WO-50 runbook.
    verifier: candidate_formal_authority_isolation_proof
    evidence_refs: [EV-WO00-CORRECTION, EV-ISOLATION]
