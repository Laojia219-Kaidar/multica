# 部署 overlay：把 backend/frontend 切到 ui-convergence 集成镜像。
# 用法（在集成树目录）：
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.ui-deploy.yml up -d
# 回滚：
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.build.yml up -d
# （回滚目标：multica-backend:dev / multica-web:dev，即 8/14 收敛镜像）
services:
  backend:
    image: multica-backend:uiconv20260815
    environment:
      # loopback owner session（免登录，owner 决策 2026-08-15）：
      # APP_ENV 放开到 local 是 local_operator_session_config 的白名单要求；
      # 多用户邀请时删除这三个变量即恢复 email 验证码登录墙。
      APP_ENV: local
      HIVECREW_LOCAL_OPERATOR_SESSION_ENABLED: "true"
      HIVECREW_LOCAL_OPERATOR_USER_ID: c93bda04-9b39-4c94-b961-3f2792ae4b82
  frontend:
    image: multica-web:uiconv20260815
